services:

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    environment:
      - LANG=fr
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH  # pass-through from shell env (no interpolation of value)
      - PORT=${WG_EASY_PORT:-51821}
      - WG_PORT=${WG_PORT:-51820}
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS:-10.8.0.1}
      - WG_MTU=${WG_MTU:-1420}
      - WG_PERSISTENT_KEEPALIVE=${WG_PERSISTENT_KEEPALIVE:-25}
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=1
    volumes:
      - ./wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "127.0.0.1:${WG_EASY_PORT:-51821}:${WG_EASY_PORT:-51821}/tcp"
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./adguard/conf:/opt/adguardhome/conf
      - ./adguard/work:/opt/adguardhome/work

  portal:
    build: ./portal
    container_name: portal
    restart: unless-stopped
    network_mode: host
    environment:
      - PORTAL_PORT=${PORTAL_PORT:-8080}
      - PORTAL_HOST=${PORTAL_HOST:-127.0.0.1}
      - WG_EASY_URL=http://127.0.0.1:${WG_EASY_PORT:-51821}
      - ADGUARD_URL=http://127.0.0.1:${ADGUARD_PORT:-3000}
      - SERVER_NAME=${SERVER_NAME:-vpn-server}
      - FAIL2BAN_JAIL=${FAIL2BAN_JAIL:-easy-wg-portal}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WG_EASY_PASSWORD=${ADMIN_PASSWORD}
      - ADGUARD_USER=admin
      - ADGUARD_PASSWORD=${ADMIN_PASSWORD}
      - ACCESS_LOG_PATH=/var/log/easy-wg-portal/access.log
      - FAIL2BAN_LOG=/var/log/fail2ban.log
      - BACKUP_DIR=/backups
      - BACKUP_KEEP=${BACKUP_KEEP:-10}
      - WG_HOST=${WG_HOST}
      - ALERT_DISK_THRESHOLD=${ALERT_DISK_THRESHOLD:-85}
      - ALERT_CERT_EXPIRY_DAYS=${ALERT_CERT_EXPIRY_DAYS:-14}
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS:-10.8.0.1}
    volumes:
      - ./portal/data:/data
      - /var/run/fail2ban:/var/run/fail2ban
      - ./caddy/logs:/var/log/easy-wg-portal:ro
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      # Health module + App Launcher: Docker socket (writable for app lifecycle management)
      - /var/run/docker.sock:/var/run/docker.sock
      # Security module: read host config files for security checks
      - /etc/ssh/sshd_config:/etc/ssh/sshd_config:ro
      - /etc/ufw:/etc/ufw:ro
      - /etc/apt/apt.conf.d:/etc/apt/apt.conf.d:ro
      # Backup module: source directories (read-only) + output directory (writable)
      - ./wireguard:/backup-src/wireguard:ro
      - ./adguard/conf:/backup-src/adguard/conf:ro
      - ./caddy:/backup-src/caddy:ro
      - ./.env:/backup-src/.env:ro
      - ./docker-compose.yml:/backup-src/docker-compose.yml:ro
      - ./compose.sh:/backup-src/compose.sh:ro
      - ./backups:/backups
      # Phase 2: portal writes easywg-services.caddy; Caddyfile read for reload
      - ./caddy:/app-caddy:rw
      # Phase 3: File Drop storage (separate from portal data for easy exclusion from backup)
      - ./filedrop:/filedrop:rw
    depends_on:
      - wg-easy
      - adguard

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/easywg-services.caddy:/etc/caddy/easywg-services.caddy:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/logs:/var/log/easy-wg-portal
    depends_on:
      - portal
