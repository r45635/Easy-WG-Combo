# Xray VLESS+Reality overlay — loaded by compose.sh when XRAY_ENABLED=yes
# Do not use directly; always use ./compose.sh

services:

  xray:
    # Version-pinned: bootstrap.sh reads this line for key generation, so the
    # x25519 CLI output format stays frozen with the image.
    image: ghcr.io/xtls/xray-core:26.7.28
    container_name: xray
    restart: unless-stopped
    network_mode: host
    user: root
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
      - ./xray/logs:/var/log/xray
    command: ["run", "-config", "/etc/xray/config.json"]

  portal:
    environment:
      - XRAY_ENABLED=yes
      - XRAY_UUID=${XRAY_UUID}
      - XRAY_PUBLIC_KEY=${XRAY_PUBLIC_KEY}
      - XRAY_SHORT_ID=${XRAY_SHORT_ID}
      - XRAY_SNI_TARGET=${XRAY_SNI_TARGET:-www.cloudflare.com}
      - XRAY_PORT=${XRAY_PORT:-443}
      - CADDY_HTTPS_PORT=${CADDY_HTTPS_PORT:-8443}
    volumes:
      # read-write: the portal reconciles config.json's client list from devices.json
      # (per-device UUIDs) on boot and on device add/revoke via syncXrayClients()
      - ./xray:/xray-config
