name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly run catches environment rot (new advisories, image/action drift)
    # even when no code changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck --severity=warning bootstrap.sh install.sh compose.sh easywg scripts/*.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Validate through compose.sh, the supported entry point: it is what
      # derives PORTAL_IMAGE_TAG from the VERSION file and injects the secrets.
      # Calling `docker compose` directly here would validate a path no
      # installation uses, and would have missed the portal image rendering
      # with an empty tag.
      - name: Validate base compose config
        run: |
          cp .env.example .env
          echo "export PASSWORD_HASH='ci-placeholder'" > .env.secrets
          ./compose.sh config -q

      - name: Validate xray overlay config
        run: XRAY_ENABLED=yes ./compose.sh config -q

      - name: docker compose directly must fail loudly, not render an empty tag
        run: |
          if docker compose config -q 2>/dev/null; then
            echo "docker compose succeeded without PORTAL_IMAGE_TAG — the guard is gone."
            exit 1
          fi
          echo "Refused as expected."


  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install Node dependencies
        working-directory: portal
        run: npm ci

      - name: Syntax check server and client JS
        working-directory: portal
        run: |
          node --check server.js
          node --check public/app.js

      - name: Unit tests
        working-directory: portal
        run: npm test

      # Moderate: report only (a new transitive CVE must not red main on its own
      # schedule; Dependabot owns the fix). High/critical: blocking.
      - name: npm audit (moderate, report only)
        working-directory: portal
        run: npm audit --audit-level=moderate || echo "::warning::npm audit found vulnerabilities — check Dependabot PRs"

      - name: npm audit (high/critical, blocking)
        working-directory: portal
        run: npm audit --audit-level=high

      - name: Build portal image
        run: docker build -t easywg-portal-ci ./portal

      - name: Smoke test image boots (with a password)
        run: |
          # ADMIN_PASSWORD is required — the portal refuses to start without it.
          docker run -d --name portal-ci -e ADMIN_PASSWORD=ci-smoke-test-pw easywg-portal-ci
          sleep 5
          docker logs portal-ci
          docker inspect -f '{{.State.Running}}' portal-ci | grep -q true

      - name: Smoke test fail-closed (no password)
        run: |
          # Security-critical: the portal MUST refuse to start with no ADMIN_PASSWORD.
          docker run -d --name portal-ci-nopw easywg-portal-ci || true
          sleep 5
          if docker inspect -f '{{.State.Running}}' portal-ci-nopw | grep -q true; then
            echo "::error::portal started without ADMIN_PASSWORD — should fail closed"; exit 1
          fi
          docker logs portal-ci-nopw 2>&1 | grep -qi "no admin password" \
            || { echo "::error::expected the fail-closed message"; exit 1; }

      # Report-only (exit-code 0): surfaces image CVEs without gating merges —
      # Dependabot owns image bumps. Intentionally not blocking.
      - name: Trivy image scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easywg-portal-ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan (tree + history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL writes its findings to the Security tab and the workflow still
  # reports success — so a green CodeQL run says nothing about what it found.
  # That is how a real SSRF sat open from 17 August to 24 October here.
  # This turns the queue into a signal: an open alert fails the build unless it
  # is listed, with a reason, in .github/codeql-accepted.txt.
  #
  # Inline `// codeql[rule-id]` comments do NOT work — GitHub code scanning
  # ignores them — which is why acceptance lives in that file instead.
  #
  # Deliberately NOT in publish's `needs`: this reads the repository's current
  # alert set, which CodeQL updates asynchronously in its own workflow, so a
  # just-pushed fix can still read as stale. It must be able to go red without
  # deadlocking a release.
  codescan:
    runs-on: ubuntu-latest
    if: github.repository == 'r45635/Easy-WG-Combo'
    permissions:
      security-events: read
    steps:
      - uses: actions/checkout@v7

      - name: Fail on any unreviewed code-scanning alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | "\(.rule.id)\t\(.most_recent_instance.location.path)"' \
            > /tmp/open.tsv 2>/dev/null || : > /tmp/open.tsv

          grep -vE '^\s*(#|$)' .github/codeql-accepted.txt | sed 's/[[:space:]]*$//' \
            | sort -u > /tmp/accepted.tsv

          sort -u /tmp/open.tsv > /tmp/open.sorted
          unreviewed=$(comm -23 /tmp/open.sorted /tmp/accepted.tsv || true)

          echo "Open alerts:      $(wc -l < /tmp/open.sorted | tr -d ' ')"
          echo "Accepted entries: $(wc -l < /tmp/accepted.tsv | tr -d ' ')"

          if [ -n "$unreviewed" ]; then
            echo ""
            echo "Unreviewed code-scanning alerts:"
            echo "$unreviewed" | sed 's/^/  /'
            echo ""
            echo "Fix them, or add the rule and path to .github/codeql-accepted.txt"
            echo "with a comment explaining why the alert is acceptable."
            exit 1
          fi
          echo "No unreviewed alerts."

  # Publishes the portal image so a server can pull it instead of building it.
  # The target boxes are 1 vCPU / 1 GB: building there is what this project's
  # own guidance forbids, and it is why updating currently means a manual
  # `docker save | ssh docker load`.
  #
  # Gated on a push to this repository and on every other job passing, so a
  # fork or a pull request can never publish.
  publish:
    runs-on: ubuntu-latest
    needs: [shell, compose, portal, secrets]
    if: github.event_name == 'push' && github.repository == 'r45635/Easy-WG-Combo'
    steps:
      - uses: actions/checkout@v7

      - name: Read project version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/r45635/easy-wg-combo-portal
          tags: |
            # The VERSION file already gives one image tag per release; this
            # workflow does not run on tag pushes, so a type=ref,event=tag
            # entry here would never produce anything.
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./portal
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
