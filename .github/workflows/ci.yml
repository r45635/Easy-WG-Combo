name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly run catches environment rot (new advisories, image/action drift)
    # even when no code changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: shellcheck --severity=warning bootstrap.sh install.sh compose.sh easywg scripts/*.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate base compose config
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Validate xray overlay config
        run: docker compose -f docker-compose.yml -f docker-compose.xray.yml config -q

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install Node dependencies
        working-directory: portal
        run: npm ci

      - name: Syntax check server and client JS
        working-directory: portal
        run: |
          node --check server.js
          node --check public/app.js

      # Non-blocking: a newly disclosed transitive CVE must not red main on its
      # own schedule. Dependabot opens the fix PR; the weekly cron surfaces it.
      - name: npm audit (report only)
        working-directory: portal
        run: npm audit --audit-level=moderate || echo "::warning::npm audit found vulnerabilities — check Dependabot PRs"

      - name: Build portal image
        run: docker build -t easywg-portal-ci ./portal

      - name: Smoke test image boots
        run: |
          docker run -d --name portal-ci easywg-portal-ci
          sleep 5
          docker logs portal-ci
          docker inspect -f '{{.State.Running}}' portal-ci | grep -q true
